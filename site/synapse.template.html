<title>Skill Synapse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a full-screen synapse map. Task hubs sit on an outer ring, skills float between them, pulses travel along "works with" links. HUD bar on top, legend bottom-left, detail panel slides in on the right. Deliberate single dark look. */
:root{
  --void:#04060C; --deep:#0A1020; --panel:rgb(12 18 34 / .82); --line:rgb(120 160 255 / .18); --line-2:rgb(120 160 255 / .32);
  --text:#E6ECFF; --text-2:#9AA6C8; --text-3:#5F6B8E; --cyan:#5CE1FF; --warn:#FFC266;
  --display:"Chakra Petch", "Eurostile", system-ui, sans-serif; --body:"IBM Plex Sans", system-ui, sans-serif; --mono:"IBM Plex Mono", ui-monospace, monospace;
  --out:cubic-bezier(0.23,1,0.32,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 90% at 50% 40%, var(--deep), var(--void) 70%);color:var(--text);font-family:var(--body);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
#cv{position:fixed;inset:0;display:block;cursor:grab;touch-action:none}
#cv.drag{cursor:grabbing}
#cv.hover{cursor:pointer}

/* HUD */
.hud{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 14px);left:16px;right:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;pointer-events:none}
.hud > *{pointer-events:auto}
.glass{background:var(--panel);border:1px solid var(--line);border-radius:12px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 10px 40px rgb(0 0 0 / .35), inset 0 1px 0 rgb(255 255 255 / .05)}
.brand{display:flex;align-items:baseline;gap:12px;padding:10px 16px}
.brand h1{margin:0;font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.08em;text-transform:uppercase}
.brand .stat{font-family:var(--mono);font-size:12px;color:var(--text-2);font-variant-numeric:tabular-nums}
.search{flex:1 1 220px;max-width:420px;display:flex;align-items:center;gap:10px;padding:0 14px;height:44px}
.search svg{width:16px;height:16px;stroke:var(--text-2);fill:none;stroke-width:2;flex:none}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:15px}
.search input::placeholder{color:var(--text-3)}
.spacer{flex:1}
.tools{display:flex;gap:6px;padding:5px}
.tbtn{height:34px;padding:0 12px;border-radius:8px;border:1px solid transparent;background:none;cursor:pointer;font-family:var(--mono);font-size:12px;color:var(--text-2);text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:background 160ms var(--out),color 160ms var(--out),transform 140ms var(--out)}
.tbtn:active{transform:scale(0.97)}
@media (hover:hover) and (pointer:fine){.tbtn:hover{background:rgb(255 255 255 / .06);color:var(--text)}}
.tbtn[aria-pressed="true"]{background:rgb(92 225 255 / .14);border-color:rgb(92 225 255 / .4);color:var(--cyan)}
@media (max-width:640px){.brand .stat{display:none}.spacer{display:none}}

/* legend */
.legend{position:fixed;z-index:5;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);padding:14px 16px;max-width:min(320px,calc(100vw - 32px))}
.legend h2{margin:0 0 10px;font-family:var(--display);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-2);font-weight:600}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tag{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:none;cursor:pointer;font-size:12.5px;color:var(--text-2);transition:border-color 160ms,color 160ms,opacity 160ms}
.tag i{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.tag[aria-pressed="false"]{opacity:.38}
.tag[aria-pressed="true"]{color:var(--text);border-color:var(--line-2)}
.keys{display:grid;grid-template-columns:34px minmax(0,1fr);gap:6px 10px;align-items:center;font-size:12.5px;color:var(--text-2)}
.keys svg{width:34px;height:12px}
.hint{font-size:11.5px;color:var(--text-3);margin:10px 0 0;line-height:1.4}
.legend.min .body{display:none}
.legend .toggle{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:6px;border:0;background:none;color:var(--text-2);cursor:pointer}

/* panel */
.panel{position:fixed;z-index:6;top:calc(env(safe-area-inset-top,0px) + 78px);right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:min(380px,calc(100vw - 32px));padding:20px;overflow:auto;
  transform:translateX(calc(100% + 24px));opacity:0;transition:transform 300ms var(--out),opacity 220ms var(--out)}
.panel.open{transform:none;opacity:1}
.panel .close{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:none;cursor:pointer;color:var(--text-2)}
.ptag{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--text-2);margin-right:10px}
.ptag i{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c)}
.panel h3{margin:10px 40px 2px 0;font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:.02em;line-height:1.1}
.panel .by{font-size:13px;color:var(--text-2)}
.panel p.sum{color:var(--text);font-size:15px;line-height:1.5;margin:14px 0 0}
.prompt{margin-top:16px;border:1px solid var(--line-2);border-radius:10px;padding:12px 14px;background:rgb(92 225 255 / .05)}
.lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3)}
.prompt p{margin:6px 0 10px;font-size:14.5px;line-height:1.45}
.copy{height:32px;padding:0 14px;border-radius:8px;border:0;background:var(--cyan);color:#04131A;font-weight:600;cursor:pointer;transition:transform 140ms var(--out)}
.copy:active{transform:scale(0.97)}
.facts{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px 12px;margin:18px 0 0;font-size:13.5px}
.facts dt{color:var(--text-3);font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding-top:2px}
.facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
.warn{color:var(--warn)}
.bars{display:inline-flex;gap:3px;vertical-align:middle;margin-right:6px}
.bars b{width:10px;height:6px;border-radius:2px;background:rgb(255 255 255 / .12)}
.bars b.f{background:var(--cyan);box-shadow:0 0 6px var(--cyan)}
.links{margin-top:18px}
.links .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.nchip{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);background:none;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:7px}
.nchip i{width:7px;height:7px;border-radius:50%;background:var(--c)}
@media (hover:hover) and (pointer:fine){.nchip:hover{border-color:var(--cyan)}}
.src{display:inline-flex;align-items:center;gap:6px;margin-top:20px;color:var(--cyan);text-decoration:none;font-weight:500}
.src svg{width:15px;height:15px;fill:currentColor}
@media (hover:hover) and (pointer:fine){.src:hover span{text-decoration:underline;text-underline-offset:3px}}

/* tooltip */
.tip{position:fixed;z-index:7;pointer-events:none;padding:8px 12px;font-size:13px;max-width:260px;opacity:0;transform:translateY(4px);transition:opacity 120ms,transform 120ms}
.tip.on{opacity:1;transform:none}
.tip b{font-family:var(--display);font-size:15px;letter-spacing:.02em;display:block}
.tip span{color:var(--text-2)}
.toast{position:fixed;z-index:8;left:50%;bottom:24px;transform:translate(-50%,16px);opacity:0;padding:10px 16px;font-size:13px;transition:transform 200ms var(--out),opacity 200ms var(--out);pointer-events:none}
.toast.on{transform:translate(-50%,0);opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){.panel,.tip,.toast{transition:none}}
</style>

<canvas id="cv" aria-label="Skill map"></canvas>

<div class="hud">
  <div class="brand glass"><h1>Skill Synapse</h1><span class="stat" id="stat"></span></div>
  <label class="search glass"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" autocomplete="off" aria-label="Search"></label>
  <span class="spacer"></span>
  <div class="tools glass">
    <button class="tbtn" id="fit" data-t="fit"></button>
    <button class="tbtn" id="lang-ru" data-lang="ru">RU</button><button class="tbtn" id="lang-en" data-lang="en">EN</button>
    <a class="tbtn" href="./" id="toList" data-t="list"></a>
  </div>
</div>

<aside class="legend glass" id="legend">
  <button class="toggle" id="legToggle" aria-label="Collapse">–</button>
  <h2 data-t="legend"></h2>
  <div class="body">
    <div class="tagrow" id="tags"></div>
    <div class="keys">
      <svg viewBox="0 0 34 12" aria-hidden="true"><path d="M2 8 Q17 0 32 6" fill="none" stroke="#FF8A3D" stroke-width="2"/><circle cx="20" cy="4" r="2.5" fill="#FFF6E0"/></svg><span data-t="kPair"></span>
      <svg viewBox="0 0 34 12" aria-hidden="true"><line x1="2" y1="6" x2="32" y2="6" stroke="#9AA6C8" stroke-width="1" stroke-dasharray="3 3"/></svg><span data-t="kTag"></span>
      <svg viewBox="0 0 34 12" aria-hidden="true"><defs><radialGradient id="dkg"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#FFC266"/><stop offset="1" stop-color="#FFB85A" stop-opacity="0"/></radialGradient></defs><circle cx="17" cy="6" r="6" fill="url(#dkg)"/></svg><span data-t="kDesk"></span>
    </div>
    <p class="hint" data-t="hint"></p>
  </div>
</aside>

<aside class="panel glass" id="panel" aria-live="polite"></aside>
<div class="tip glass" id="tip" role="tooltip"></div>
<div class="toast glass" id="toast" role="status"></div>

<script>
/*SKILLS*/
const TAGS={motion:["Моушн","Motion","#B48CFF"],ui:["UI/UX","UI/UX","#5C9DFF"],web:["Веб","Web","#2EE6C5"],style:["Стиль","Style","#FF6FAE"],game2d:["Геймдев 2D","Game dev 2D","#FFB347"],video:["Видео","Video","#FF7A59"],slides:["Презентации","Presentations","#8A93FF"],text:["Тексты","Writing","#C9D3EA"],engineering:["Инженерия","Engineering","#7CF29A"]};
const T={
 ru:{stat:(n,l)=>`${n} скиллов · ${l} связей`,search:"Найти скилл",fit:"Показать всё",list:"Список",legend:"Задачи",kPair:"Работают вместе",kTag:"Относится к задаче",kDesk:"Только десктоп",
  hint:"Наведи, чтобы увидеть связи. Клик открывает карточку. Тяни, чтобы вращать пространство, колесо или щипок приближают.",
  prompt:"Пример промпта",copy:"Скопировать",copied:"Промпт скопирован",copyFail:"Не удалось скопировать",where:"Где",needs:"Нужно",load:"Нагрузка",lic:"Лицензия",note:"Учесть",checked:"Проверен",linked:"Связан с",src:"Репозиторий автора",
  w:{web:"Веб и десктоп",desktop:"Только десктоп"},n:{text:"Только текст",node:"Node",ffmpeg:"ffmpeg"},close:"Закрыть"},
 en:{stat:(n,l)=>`${n} skills · ${l} links`,search:"Find a skill",fit:"Fit all",list:"List",legend:"Tasks",kPair:"Work together",kTag:"Belongs to task",kDesk:"Desktop only",
  hint:"Hover to see links. Click to open the card. Drag to rotate the space, scroll or pinch to zoom.",
  prompt:"Example prompt",copy:"Copy",copied:"Prompt copied",copyFail:"Couldn't copy",where:"Runs in",needs:"Requires",load:"Load",lic:"Licence",note:"Note",checked:"Checked",linked:"Linked to",src:"Author's repository",
  w:{web:"Web and desktop",desktop:"Desktop only"},n:{text:"Text only",node:"Node",ffmpeg:"ffmpeg"},close:"Close"}
};
let lang="ru";try{lang=localStorage.getItem("si-lang")||"ru"}catch(e){}
const li=()=>lang==="ru"?0:1, $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

/* graph */
const norm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,"");
const usedTags=Object.keys(TAGS).filter(t=>S.some(s=>s.tags.includes(t)));
const nodes=[],links=[],byId={};
usedTags.forEach((t,i)=>{const n={id:"tag:"+t,hub:true,tag:t,x:0,y:0,vx:0,vy:0,r:22};nodes.push(n);byId[n.id]=n});
S.forEach((s,i)=>{const a=i/S.length*Math.PI*2;const n={id:s.id,s,x:Math.cos(a)*140,y:Math.sin(a)*140,vx:0,vy:0,r:9+Math.min(5,s.tags.length*1.5)};nodes.push(n);byId[n.id]=n;
 s.tags.forEach(t=>links.push({a:n,b:byId["tag:"+t],kind:"tag"}))});
const nameIx={};S.forEach(s=>{nameIx[norm(s.name)]=s.id;nameIx[norm(s.skill)]=s.id});
const pairSet=new Set();
S.forEach(s=>String(s.pairs||"").split(",").map(x=>x.trim()).filter(Boolean).forEach(p=>{const id=nameIx[norm(p)];if(!id||id===s.id)return;const k=[s.id,id].sort().join("|");if(pairSet.has(k))return;pairSet.add(k);links.push({a:byId[s.id],b:byId[id],kind:"pair",ph:Math.random()})}));
const nbr={};nodes.forEach(n=>nbr[n.id]=new Set());links.forEach(l=>{nbr[l.a.id].add(l.b.id);nbr[l.b.id].add(l.a.id)});
const pairCount=links.filter(l=>l.kind==="pair").length;

/* layout: 3D space */
const cv=$("#cv"),ctx=cv.getContext("2d");let W=0,H=0,DPR=1,FOC=800;
const SP=2*(1+8/Math.max(1,S.length));/* spacing: always >=2x, grows as the catalogue shrinks */
const SPH=280*SP;
const cam={yaw:.6,pitch:-.28,dist:1000,tx:0,ty:0,tz:0,gx:0,gy:0,gz:0,gd:1000};
let lastUser=0;
function hubSphere(){const n=usedTags.length,ga=Math.PI*(3-Math.sqrt(5));usedTags.forEach((t,i)=>{const y=1-(i+.5)/n*2,r=Math.sqrt(1-y*y),a=i*ga;const h=byId["tag:"+t];h.x=Math.cos(a)*r*SPH;h.y=y*SPH*.8;h.z=Math.sin(a)*r*SPH})}
nodes.forEach(n=>{if(!n.hub){const u=hash(n.id+"u")*2-1,a=hash(n.id+"a")*Math.PI*2,r=120*SP*Math.cbrt(hash(n.id+"r")+.1);n.x=Math.cos(a)*Math.sqrt(1-u*u)*r;n.y=u*r;n.z=Math.sin(a)*Math.sqrt(1-u*u)*r;n.vz=0}});
hubSphere();
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+"px";cv.style.height=H+"px";FOC=Math.min(W,H)*.95;kick()}
let alpha=1;function kick(){alpha=1}
function tick(){
 if(alpha<0.005)return;alpha*=0.985;
 for(let i=0;i<nodes.length;i++){const a=nodes[i];if(a.hub)continue;
  for(let j=0;j<nodes.length;j++){if(i===j)continue;const b=nodes[j];let dx=a.x-b.x,dy=a.y-b.y,dz=a.z-b.z,d2=dx*dx+dy*dy+dz*dz+.01;const rep=(b.hub?6000:3200)*SP*SP*SP/d2;const d=Math.sqrt(d2);a.vx+=dx/d*rep*alpha;a.vy+=dy/d*rep*alpha;a.vz+=dz/d*rep*alpha}
  a.vx-=a.x*0.0015*alpha;a.vy-=a.y*0.0015*alpha;a.vz-=a.z*0.0015*alpha}
 links.forEach(l=>{const a=l.a,b=l.b;const dx=b.x-a.x,dy=b.y-a.y,dz=b.z-a.z,d=Math.hypot(dx,dy,dz)||1;const L=(l.kind==="pair"?130:190)*SP,k=l.kind==="pair"?0.02:0.008;const f=(d-L)*k*alpha;
  if(!a.hub){a.vx+=dx/d*f;a.vy+=dy/d*f;a.vz+=dz/d*f}if(!b.hub){b.vx-=dx/d*f;b.vy-=dy/d*f;b.vz-=dz/d*f}});
 nodes.forEach(n=>{if(n.hub)return;n.vx*=0.82;n.vy*=0.82;n.vz*=0.82;n.x+=n.vx;n.y+=n.vy;n.z+=n.vz});
}

/* state */
const st={q:"",off:new Set(),hover:null,sel:null};
function visible(n){if(n.hub)return !st.off.has(n.tag);const s=n.s;if(s.tags.every(t=>st.off.has(t)))return false;return true}
function matches(n){if(!st.q)return true;if(n.hub)return false;const q=st.q.toLowerCase();const s=n.s;return (s.name+" "+s.skill+" "+s.author+" "+s.sum.join(" ")).toLowerCase().includes(q)}
function focusSet(){const f=st.hover||st.sel;if(!f)return null;return new Set([f.id,...nbr[f.id]])}

/* projection: orbit camera around a target */
let cy_=1,sy_=0,cp_=1,sp_=0;
function camPrep(){cy_=Math.cos(cam.yaw);sy_=Math.sin(cam.yaw);cp_=Math.cos(cam.pitch);sp_=Math.sin(cam.pitch)}
function proj(x,y,z){x-=cam.tx;y-=cam.ty;z-=cam.tz;const x1=x*cy_-z*sy_,z1=x*sy_+z*cy_;const y2=y*cp_-z1*sp_,z2=y*sp_+z1*cp_;const zc=Math.max(60,z2+cam.dist),s=FOC/zc;return [W/2+x1*s,H/2+y2*s,zc,s]}
/* depth fog: 1 near, ~.3 far */
const fog=zc=>Math.max(.28,Math.min(1,1.15-(zc-cam.dist)/(SPH*2.6)));
let t0=performance.now(),lastT=t0;
function hexA(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${Math.max(0,Math.min(1,a))})`}
function hash(s){let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return ((h>>>0)%10000)/10000}
/* 3D bend: offset the midpoint perpendicular to the link, direction fixed per link */
function ctrl3(l,k){const a=l.a,b=l.b,mx=(a.x+b.x)/2,my=(a.y+b.y)/2,mz=(a.z+b.z)/2,dx=b.x-a.x,dy=b.y-a.y,dz=b.z-a.z,len=Math.hypot(dx,dy,dz)||1;
 if(!l.bv){const th=hash(l.a.id+l.b.id+"t")*Math.PI*2;l.bend=(hash(l.a.id+l.b.id)-.5)*.6+(.15*Math.sign(hash(l.b.id)-.5));l.th=th;l.bv=1}
 // two perpendicular axes
 let ux=-dz,uy=0,uz=dx;let ul=Math.hypot(ux,uz);if(ul<1e-3){ux=1;uz=0;ul=1}ux/=ul;uz/=ul;
 const vx=(dy*uz-dz*uy)/len,vy=(dz*ux-dx*uz)/len,vz=(dx*uy-dy*ux)/len;
 const off=l.bend*len*k,c=Math.cos(l.th),s=Math.sin(l.th);return [mx+(ux*c+vx*s)*off,my+(uy*c+vy*s)*off,mz+(uz*c+vz*s)*off]}
function qpt(x1,y1,cx,cy,x2,y2,t){const u=1-t;return [u*u*x1+2*u*t*cx+t*t*x2,u*u*y1+2*u*t*cy+t*t*y2]}

function drawLink(l,P,t,F,focus,dim,anyQ){
 const pa=P.get(l.a),pb=P.get(l.b);const [x1,y1]=pa,[x2,y2]=pb;const zc=(pa[2]+pb[2])/2,fg=fog(zc),sk=Math.max(.5,Math.min(1.8,FOC/zc));
 const lit=focus&&(l.a===focus||l.b===focus);const faded=(F&&!lit)||(anyQ&&(dim(l.a)||dim(l.b)));
 if(l.kind==="tag"){const hub=l.a.hub?l.a:l.b,c=TAGS[hub.tag][2];const [X,Y,Z]=ctrl3(l,.9),[cx,cy]=proj(X,Y,Z);
  ctx.strokeStyle=hexA(c,(faded?.03:lit?.55:.11)*fg);ctx.lineWidth=(lit?1.4:.8)*sk;ctx.beginPath();ctx.moveTo(x1,y1);ctx.quadraticCurveTo(cx,cy,x2,y2);ctx.stroke();
  if(lit&&!reduce){const p=(t*.5+hash(l.a.id))%1;const [px,py]=qpt(x1,y1,cx,cy,x2,y2,p);ctx.fillStyle=hexA(c,.9*fg);ctx.beginPath();ctx.arc(px,py,1.8*sk,0,Math.PI*2);ctx.fill()}return}
 const A=(faded?.12:1)*fg;const ca=TAGS[l.a.s.tags[0]][2],cb=TAGS[l.b.s.tags[0]][2];
 for(let f=0;f<4;f++){const [X,Y,Z]=ctrl3(l,.55+f*.18),[cx,cy]=proj(X,Y,Z);const wob=reduce?0:Math.sin(t*.8+f+l.ph*6)*3*sk;
  const gr=ctx.createLinearGradient(x1,y1,x2,y2);gr.addColorStop(0,hexA("#FF8A3D",(f?.22:.55)*A*(lit?1.6:1)));gr.addColorStop(.5,hexA(ca,(f?.18:.45)*A*(lit?1.6:1)));gr.addColorStop(1,hexA(cb,(f?.22:.55)*A*(lit?1.6:1)));
  ctx.strokeStyle=gr;ctx.lineWidth=(f?0.7:(lit?3.2:2.2))*sk;ctx.beginPath();ctx.moveTo(x1,y1);ctx.quadraticCurveTo(cx+wob,cy-wob,x2,y2);ctx.stroke()}
 const [X,Y,Z]=ctrl3(l,.55),[cx,cy]=proj(X,Y,Z);
 if(!faded){ctx.strokeStyle=hexA("#FFB36B",(lit?.14:.06)*fg);ctx.lineWidth=(lit?14:9)*sk;ctx.beginPath();ctx.moveTo(x1,y1);ctx.quadraticCurveTo(cx,cy,x2,y2);ctx.stroke()}
 for(let i=1;i<6;i++){const [bx,by]=qpt(x1,y1,cx,cy,x2,y2,i/6);const tw=reduce?.7:.5+.5*Math.sin(t*2.2+i*1.7+l.ph*9);ctx.fillStyle=hexA(i%2?"#FFD36B":"#7CF2D0",.75*A*tw);ctx.beginPath();ctx.arc(bx,by,(lit?2.2:1.6)*sk,0,Math.PI*2);ctx.fill()}
 if(!reduce&&!faded){const n=lit?3:1;for(let s=0;s<n;s++){const base=(t*.28+l.ph+s/n)%1,dir=(s%2)?-1:1;for(let k=0;k<9;k++){const p=dir>0?base-k*.012:1-base+k*.012;if(p<0||p>1)continue;const [px,py]=qpt(x1,y1,cx,cy,x2,y2,p);const a=(1-k/9)*fg;const R=(k?3:9)*sk;
   const g=ctx.createRadialGradient(px,py,0,px,py,R);g.addColorStop(0,`rgba(255,250,235,${a*(k?.6:1)})`);g.addColorStop(1,"rgba(255,170,90,0)");ctx.fillStyle=g;ctx.beginPath();ctx.arc(px,py,R,0,Math.PI*2);ctx.fill()}}}
}
/* soft glowing orb, pre-rendered per colour: layered falloff (white core, tight bloom, wide haze), no edge */
const ORB={};
function orbSprite(c){if(ORB[c])return ORB[c];const N=256,cv2=document.createElement("canvas");cv2.width=cv2.height=N;const g=cv2.getContext("2d"),img=g.createImageData(N,N),D=img.data;
 const n=parseInt(c.slice(1),16),cr=n>>16&255,cg=n>>8&255,cb=n&255;
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){const d=Math.hypot(x-N/2+.5,y-N/2+.5)/(N/2);if(d>=1)continue;
  const win=Math.pow(1-d*d,2);// fades every layer to exactly zero at the rim
  const core=Math.exp(-Math.pow(d/.06,2));
  const bloom=.8*Math.exp(-d/.09)+.38*Math.exp(-d/.22)+.14*Math.exp(-d/.5);
  const I=Math.min(1,(core+bloom)*win),w=core/(core+bloom+1e-6);// whiteness only in the core
  const i=(y*N+x)*4;D[i]=cr+(255-cr)*w;D[i+1]=cg+(255-cg)*w;D[i+2]=cb+(255-cb)*w;D[i+3]=I*255}
 g.putImageData(img,0,0);return ORB[c]=cv2}
function glowOrb(x,y,R,c,k){const ga=ctx.globalAlpha;ctx.globalCompositeOperation="lighter";ctx.globalAlpha=ga*Math.min(1,k);ctx.drawImage(orbSprite(c),x-R,y-R,R*2,R*2);ctx.globalAlpha=ga}
function drawNode(n,p,t,F,focus,dim,anyQ){
 const [x,y,zc,s]=p;const d=dim(n);const fg=fog(zc);const sc=Math.max(.5,Math.min(2.2,s*Math.sqrt(SP)));
 if(n.hub){const c=TAGS[n.tag][2],r=34*sc;ctx.globalAlpha=(d?.25:1)*fg;
  const pul=reduce?1:1+Math.sin(t*.9+hash(n.id)*7)*.06;glowOrb(x,y,r*3.4*pul,c,.95);
  ctx.globalCompositeOperation="source-over";ctx.font=`600 ${Math.round(10+2*Math.min(1.3,sc))}px 'Chakra Petch', sans-serif`;ctx.textAlign="center";ctx.textBaseline="top";ctx.fillStyle=c;ctx.fillText(TAGS[n.tag][li()].toUpperCase(),x,y+r*.9);ctx.globalCompositeOperation="lighter";ctx.globalAlpha=1;return}
 const c=TAGS[n.s.tags[0]][2],active=n===focus,r=n.r*sc;ctx.globalAlpha=(d?.15:1)*fg;const breath=reduce?1:1+Math.sin(t*1.6+hash(n.id)*9)*.08;
 const k=6+(n.s.tags.length*2);for(let i=0;i<k;i++){const a=hash(n.id+i)*Math.PI*2+(reduce?0:Math.sin(t*.4+i)*.05)+cam.yaw*.35*(hash(i+n.id)-.5),L=r*(1.8+hash(i+n.id)*2.6)*(active?1.3:1);
  const ex=x+Math.cos(a)*L,ey=y+Math.sin(a)*L,mx=x+Math.cos(a+.35)*L*.55,my=y+Math.sin(a+.35)*L*.55;const g=ctx.createLinearGradient(x,y,ex,ey);g.addColorStop(0,hexA(c,.55));g.addColorStop(1,hexA(c,0));
  ctx.strokeStyle=g;ctx.lineWidth=1.1*Math.min(1.4,sc);ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(mx,my,ex,ey);ctx.stroke()}
 glowOrb(x,y,r*5*breath*(active?1.25:1),c,1);

 ctx.globalCompositeOperation="source-over";
 const orb=.32+.18*Math.abs(Math.sin(cam.pitch+hash(n.id)*2)),tilt=-.35+hash(n.id+"o")*.7+cam.yaw*.15;const tg=n.s.tags;tg.forEach((tt,i)=>{const ang=(reduce?0:t*.5)+i*Math.PI*2/tg.length+hash(n.id)*6,ox=Math.cos(ang)*r*2.1,oy=Math.sin(ang)*r*2.1*orb,cs=Math.cos(tilt),sn=Math.sin(tilt),sx=x+ox*cs-oy*sn,sy=y+ox*sn+oy*cs,rr=Math.max(1.6,r*.22)*(active?1.3:1),cc=TAGS[tt][2];
  ctx.globalCompositeOperation="lighter";const gg=ctx.createRadialGradient(sx,sy,0,sx,sy,rr*3.2);gg.addColorStop(0,"rgba(255,255,255,.95)");gg.addColorStop(.3,hexA(cc,.9));gg.addColorStop(1,hexA(cc,0));ctx.fillStyle=gg;ctx.beginPath();ctx.arc(sx,sy,rr*3.2,0,Math.PI*2);ctx.fill()});
 if(n.s.where==="desktop")glowOrb(x,y,r*6.5,"#FFB85A",.45);
 if(active){ctx.globalCompositeOperation="lighter";const ag=ctx.createRadialGradient(x,y,0,x,y,r*5);ag.addColorStop(0,"rgba(255,255,255,.55)");ag.addColorStop(.3,hexA(c,.3));ag.addColorStop(1,hexA(c,0));ctx.fillStyle=ag;ctx.beginPath();ctx.arc(x,y,r*5,0,Math.PI*2);ctx.fill()}
 const showLabel=active||(F&&F.has(n.id))||(anyQ&&matches(n))||(!F&&fg>.5);
 if(showLabel){ctx.globalAlpha=(d?.3:1)*Math.max(.55,fg);const fs=Math.round(11+2*Math.min(1.2,sc));ctx.font=`${active?600:500} ${fs}px 'IBM Plex Sans', sans-serif`;ctx.textAlign="center";ctx.textBaseline="top";const label=n.s.name,w=ctx.measureText(label).width,ly=y+r*2.2+8;
  ctx.fillStyle="rgba(3,5,10,.66)";ctx.beginPath();ctx.roundRect?ctx.roundRect(x-w/2-7,ly-2,w+14,fs+7,10):ctx.rect(x-w/2-7,ly-2,w+14,fs+7);ctx.fill();ctx.fillStyle=active?"#fff":"#E2E8FA";ctx.fillText(label,x,ly+1)}
 ctx.globalCompositeOperation="lighter";ctx.globalAlpha=1}
const NEB=[["#3A2A8C",-1,.2,.4,1.3],["#0E5A6E",1,-.3,-.5,1.1],["#7A2E5C",.2,.6,1,1],["#1F3F9E",-.4,-.7,-1,1.2],["#6B3A12",.9,.5,.2,.8],["#123E4A",0,0,0,1.6]];
function drawNebula(){NEB.forEach(([c,x,y,z,r])=>{const [sx,sy,zc,sc]=proj(x*SPH*1.3,y*SPH,z*SPH*1.3);const R=r*SPH*sc*1.4;if(zc<80)return;const g=ctx.createRadialGradient(sx,sy,0,sx,sy,R);g.addColorStop(0,hexA(c,.22));g.addColorStop(.45,hexA(c,.09));g.addColorStop(1,hexA(c,0));ctx.fillStyle=g;ctx.fillRect(sx-R,sy-R,R*2,R*2)});
 // depth haze: a lighter band toward the centre of the space
 const [cx,cy,,cs]=proj(0,0,0),hr=SPH*cs*1.6,h=ctx.createRadialGradient(cx,cy,0,cx,cy,hr);h.addColorStop(0,"rgba(90,110,200,.10)");h.addColorStop(1,"rgba(90,110,200,0)");ctx.fillStyle=h;ctx.fillRect(cx-hr,cy-hr,hr*2,hr*2)}
let P=new Map();
function draw(now){
 tick();const t=(now-t0)/1000,dt=Math.min(.05,(now-lastT)/1000);lastT=now;
 // camera easing + slow drift when idle
 const e=1-Math.pow(.002,dt);cam.tx+=(cam.gx-cam.tx)*e;cam.ty+=(cam.gy-cam.ty)*e;cam.tz+=(cam.gz-cam.tz)*e;cam.dist+=(cam.gd-cam.dist)*e;
 if(!reduce&&!st.hover&&!drag&&now-lastUser>2500)cam.yaw+=dt*.06;
 camPrep();
 ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalCompositeOperation="source-over";
 const bg=ctx.createRadialGradient(W*.5,H*.45,0,W*.5,H*.45,Math.max(W,H)*.8);bg.addColorStop(0,"#0B1024");bg.addColorStop(.55,"#05070F");bg.addColorStop(1,"#020306");ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 ctx.globalCompositeOperation="lighter";drawNebula();
 const F=focusSet(),anyQ=!!st.q,focus=st.hover||st.sel;const dim=n=>(F&&!F.has(n.id))||(anyQ&&!n.hub&&!matches(n));
 P=new Map();nodes.forEach(n=>P.set(n,proj(n.x,n.y,n.z)));
 // painter's order: far to near
 const items=[];
 links.forEach(l=>{if(visible(l.a)&&visible(l.b))items.push([(P.get(l.a)[2]+P.get(l.b)[2])/2+(l.kind==="tag"?40:0),0,l])});
 nodes.forEach(n=>{if(visible(n))items.push([P.get(n)[2],1,n])});
 items.sort((a,b)=>b[0]-a[0]);
 items.forEach(([,k,o])=>k?drawNode(o,P.get(o),t,F,focus,dim,anyQ):drawLink(o,P,t,F,focus,dim,anyQ));
 ctx.globalCompositeOperation="source-over";
 const v=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.75);v.addColorStop(0,"rgba(0,0,0,0)");v.addColorStop(1,"rgba(0,0,0,.55)");ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
 requestAnimationFrame(draw);
}

/* interaction: drag orbits, wheel/pinch zooms */
function pick(sx,sy){let best=null,bz=1e9;nodes.forEach(n=>{if(!visible(n)||!P.has(n))return;const [x,y,zc,s]=P.get(n);const sc=Math.max(.5,Math.min(2.2,s*Math.sqrt(SP)));const R=(n.hub?26:n.r*1.5)*sc+6;if(Math.hypot(x-sx,y-sy)<R&&zc<bz){bz=zc;best=n}});return best}
let drag=null,moved=false,pinch=null;const ptrs=new Map();
const zoomTo=d=>{cam.gd=Math.max(380,Math.min(2400*SP,d))};
cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;lastUser=performance.now();
 if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),gd:cam.gd};drag=null;return}
 drag={x:e.clientX,y:e.clientY,yaw:cam.yaw,pitch:cam.pitch};cv.classList.add("drag")});
cv.addEventListener("pointermove",e=>{if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pinch&&ptrs.size===2){const [a,b]=[...ptrs.values()];zoomTo(pinch.gd*pinch.d/Math.hypot(a.x-b.x,a.y-b.y));lastUser=performance.now();return}
 if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>3)moved=true;cam.yaw=drag.yaw+dx*.006;cam.pitch=Math.max(-1.35,Math.min(1.35,drag.pitch-dy*.006));lastUser=performance.now();showTip(null);return}
 const n=pick(e.clientX,e.clientY);st.hover=n&&!n.hub?n:null;cv.classList.toggle("hover",!!n);showTip(n,e.clientX,e.clientY)});
function up(e){ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;cv.classList.remove("drag");
 if(!moved&&drag){const n=pick(e.clientX,e.clientY);if(n&&!n.hub)select(n);else if(n&&n.hub)toggleTag(n.tag,true);else select(null)}
 drag=null}
cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
cv.addEventListener("pointerleave",()=>{st.hover=null;showTip(null)});
cv.addEventListener("wheel",e=>{e.preventDefault();lastUser=performance.now();zoomTo(cam.gd*Math.exp(e.deltaY*.0012))},{passive:false});

function showTip(n,x,y){const tip=$("#tip");if(!n){tip.classList.remove("on");return}
 if(n.hub){tip.innerHTML=`<b style="color:${TAGS[n.tag][2]}">${TAGS[n.tag][li()]}</b><span>${nbr[n.id].size} · ${lang==="ru"?"клик: показать только эту задачу":"click: show only this task"}</span>`}
 else tip.innerHTML=`<b>${esc(n.s.name)}</b><span>${esc(n.s.sum[li()])}</span>`;
 tip.style.left=Math.min(x+16,innerWidth-280)+"px";tip.style.top=(y+16)+"px";tip.classList.add("on")}

function toggleTag(t,solo){if(solo){const only=st.off.size===usedTags.length-1&&!st.off.has(t);st.off=new Set(only?[]:usedTags.filter(x=>x!==t))}else{st.off.has(t)?st.off.delete(t):st.off.add(t)}renderTags()}
/* selecting flies the camera to the neuron */
function select(n){st.sel=n;renderPanel();if(n){cam.gx=n.x;cam.gy=n.y;cam.gz=n.z;zoomTo(Math.min(cam.gd,720+200*SP));lastUser=performance.now()}}
function fit(){const R=Math.max(...nodes.map(n=>Math.hypot(n.x,n.y,n.z)))+80;cam.gx=cam.gy=cam.gz=0;zoomTo(R*FOC/(Math.min(W,H)*.5)+R*.2)}

/* UI */
function renderTags(){$("#tags").innerHTML=usedTags.map(t=>`<button class="tag" style="--c:${TAGS[t][2]}" data-tag="${t}" aria-pressed="${!st.off.has(t)}"><i></i>${TAGS[t][li()]}</button>`).join("")}
const ext='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>';
function renderPanel(){const p=$("#panel"),t=T[lang],n=st.sel;if(!n){p.classList.remove("open");return}
 const s=n.s,ls=[...nbr[n.id]].map(id=>byId[id]).filter(x=>!x.hub);
 p.innerHTML=`<button class="close" id="close" aria-label="${t.close}">✕</button>
  <div>${s.tags.map(x=>`<span class="ptag" style="--c:${TAGS[x][2]}"><i></i>${TAGS[x][li()]}</span>`).join("")}</div>
  <h3>${esc(s.name)}</h3><div class="by">${esc(s.author)} · <span style="font-family:var(--mono)">${esc(s.skill)}</span></div>
  <p class="sum">${esc(s.sum[li()])}</p>
  <div class="prompt"><span class="lbl">${t.prompt}</span><p>${esc(s.prompt[li()])}</p><button class="copy" id="copy">${t.copy}</button></div>
  <dl class="facts">
   <dt>${t.where}</dt><dd class="${s.where==="desktop"?"warn":""}">${t.w[s.where]}</dd>
   <dt>${t.needs}</dt><dd>${s.needs.map(x=>t.n[x]||x).join(", ")}</dd>
   <dt>${t.load}</dt><dd><span class="bars">${[1,2,3,4,5].map(i=>`<b class="${i<=s.load?"f":""}"></b>`).join("")}</span>${s.load}/5</dd>
   <dt>${t.lic}</dt><dd class="${s.warn?"warn":""}">${esc(s.lic)}</dd>
   <dt>${t.note}</dt><dd>${esc(s.risk[li()])}</dd>
   <dt>${t.checked}</dt><dd>${esc(s.checked)}</dd>
  </dl>
  ${ls.length?`<div class="links"><span class="lbl">${t.linked}</span><div class="chips">${ls.map(x=>`<button class="nchip" data-go="${x.id}" style="--c:${TAGS[x.s.tags[0]][2]}"><i></i>${esc(x.s.name)}</button>`).join("")}</div></div>`:""}
  <a class="src" href="${s.src}" target="_blank" rel="noopener"><span>${t.src}</span>${ext}</a>`;
 p.classList.add("open")}
function renderStatic(){const t=T[lang];document.documentElement.lang=lang;document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t[e.dataset.t]);
 $("#q").placeholder=t.search;$("#stat").textContent=t.stat(S.length,pairCount);
 $("#lang-ru").setAttribute("aria-pressed",lang==="ru");$("#lang-en").setAttribute("aria-pressed",lang==="en")}
function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2000)}
function render(){renderStatic();renderTags();renderPanel()}

document.addEventListener("click",e=>{
 const lg=e.target.closest("[data-lang]");if(lg){lang=lg.dataset.lang;try{localStorage.setItem("si-lang",lang)}catch(_){}render();return}
 const tg=e.target.closest("[data-tag]");if(tg){toggleTag(tg.dataset.tag,false);return}
 if(e.target.closest("#close")){select(null);return}
 if(e.target.closest("#fit")){fit();return}
 if(e.target.closest("#legToggle")){const l=$("#legend");l.classList.toggle("min");e.target.textContent=l.classList.contains("min")?"+":"–";return}
 const go=e.target.closest("[data-go]");if(go){select(byId[go.dataset.go]);return}
 if(e.target.closest("#copy")){const s=st.sel.s;try{navigator.clipboard.writeText(s.prompt[li()]).then(()=>toast(T[lang].copied)).catch(()=>toast(T[lang].copyFail))}catch(_){toast(T[lang].copyFail)}}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")select(null)});
$("#q").addEventListener("input",e=>{st.q=e.target.value.trim();const hits=nodes.filter(n=>!n.hub&&matches(n));if(st.q&&hits.length===1)select(hits[0])});
addEventListener("resize",resize);
resize();for(let i=0;i<400;i++)tick();alpha=.3;fit();cam.dist=cam.gd;render();requestAnimationFrame(draw);
</script>
